<!DOCTYPE html>
<html lang=“zh-CN”>
<head>
    <meta charset=“UTF-8”>
    <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
    <title>蔚蓝档案 桃信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: ‘Microsoft YaHei’, sans-serif;
            display: flex;
            padding: 20px;
        }
        /* 左侧成员列表 */
        .member-list {
            width: 280px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-right: 20px;
        }
        .list-title {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }
        .member-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }
        .member-item:hover {
            background: rgba(255,255,255,0.15);
        }
        .member-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ff6ec7;
            margin-right: 12px;
        }
        .member-info .name {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }
        .member-info .msg-preview {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
 correspondence: 1.4;
        }
        /* 右侧聊天区 */
        .chat-area {
            flex: 1;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class=“member-list”>
        <div class=“list-title”>学生列表</div>
        <!— 在这里添加成员 —>
        <div class=“member-item”>
            <div class=“member-avatar”></div>
            <div class=“member-info”>
                <div class=“name”>角色名称</div>
                <div class=“msg-preview”>点击开始聊天</div>
            </div>
        </div>
    </div>
    <div class=“chat-area”>
        <div class=“chat-header”>与学生的对话</div>
        <div class=“chat-messages”>
